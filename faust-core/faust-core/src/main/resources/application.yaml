spring:
  # Database Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/project_faust?client_encoding=UTF8&reWriteBatchedInserts=true
    username: postgres
    password: Palesse123
    driver-class-name: org.postgresql.Driver

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: faust-v5
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    default-schema: public

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      api-key: ${GOOGLE_API_KEY:}

  # JPA / Hibernate 7 Settings
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Hibernate Envers for Audit Logging
        integration:
          envers:
            enabled: true # Set to true if audit logging is needed
        # Performance optimization for batch inserts
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true

  # Security Configuration
  # Note: In modern Spring Boot, "security.enabled: false" is deprecated.
  # You should manage this via a SecurityFilterChain @Bean in your code.
  security:
    user:
      name: admin

# Documentation (Swagger/OpenAPI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true

# Application Specific Properties
documents:
  expiry:
    soon-days: 30
    warning-days: 60

# Logging Levels
logging:
  level:
    root: INFO
    com.projectfaust: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    # Log Liquibase activity
    liquibase: INFO

# Server Configuration
server:
  port: 8080

faust:
  hlidac-statu:
