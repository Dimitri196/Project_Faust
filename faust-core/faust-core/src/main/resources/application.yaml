spring:
  jmx:
    enabled: false

  # Database Connection
  datasource:
    url: jdbc:postgresql://localhost:5432/project_faust?client_encoding=UTF8&reWriteBatchedInserts=true
    username: postgres
    password: Palesse123
    driver-class-name: org.postgresql.Driver

  kafka:
    consumer:
      bootstrap-servers: localhost:9092
      group-id: faust-v5
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

  # Liquibase Configuration
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: false
    default-schema: public

  # Spring AI Configuration
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
    google:
      api-key: ${GOOGLE_API_KEY:}
    # Anthropic Claude — added as primary AI model for intelligence briefs.
    # Key format: sk-ant-... — get from console.anthropic.com → API Keys.
    # Injected via environment variable ANTHROPIC_API_KEY for security.
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}

  # JPA / Hibernate 7 Settings
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        # Hibernate Envers for Audit Logging
        integration:
          envers:
            enabled: true
        # Performance optimization for batch inserts
        jdbc:
          batch_size: 50
          order_inserts: true
          order_updates: true
          batch_versioned_data: true

  # Security Configuration
  security:
    user:
      name: admin

# Documentation (Swagger/OpenAPI)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha
    tagsSorter: alpha
    display-request-duration: true

# Application Specific Properties
documents:
  expiry:
    soon-days: 30
    warning-days: 60

# Logging Levels
logging:
  level:
    root: INFO
    com.projectfaust: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    liquibase: INFO

# Server Configuration
server:
  port: 9090

faust:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  hlidac-statu:
    api-token: "fc1dba02a0dd465f8f568626472ece38"
  theses-cz:
    base-url: "https://theses.cz/api/v1"
    search-endpoint: "/search"
  semantic-scholar:
    api-key: ""  # optional — leave blank for anonymous access (1000 RPS shared pool)
    # get key at semanticscholar.org/product/api for dedicated 1 RPS
  topics:
    raw-contracts: "ingest.hlidac.contracts"
    raw-theses: "ingest.academic.theses"
    raw-realestate: "ingest.realestate.ownership"
    anomalies: "analysis.anomalies"
  # AI model configuration — priority: Claude → OpenAI → Gemini
  # Change model names here without touching any Java code.
  ai:
    # Claude (Anthropic) — primary model for intelligence briefs.
    # Reads from spring.ai.anthropic.api-key above.
    claude-api-key: ${ANTHROPIC_API_KEY:}
    claude-model: claude-sonnet-4-6
    # OpenAI — first fallback when Claude quota is exhausted or key missing.
    openai-model: gpt-4o
    # Google Gemini — last resort fallback.
    gemini-model: gemini-2.5-flash
    # Max tokens for AI responses — 2048 is sufficient for intelligence briefs.
    # Increase to 4096 if reports are being truncated.
    max-tokens: 2048